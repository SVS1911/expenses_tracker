<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <main class="app">

    <header class="page-header">
      <div>
        <a class="back-link" href="landing.html">← Overview</a>
        <h1>Add an expense</h1>
        <p class="subtitle">Keep your spending clear and intentional.</p>
      </div>
      <button id="logout" class="outline-button">Logout</button>
    </header>

    <p id="limitAlert" class="limit-alert" aria-live="polite"></p>

    <form id="expenseForm">
      <input id="title"
             placeholder="Title"
             required>

      <input id="amount"
             type="number"
             placeholder="Amount"
             required>

      <select id="category" required>
        <option value="" selected disabled>Select a category</option>
        <option>Academic</option>
        <option>Food</option>
        <option>Travel</option>
        <option>Shopping</option>
        <option>Bills</option>
        <option>Entertainment</option>
        <option>Other</option>
      </select>

      <input id="date"
             type="date"
             required>

      <input id="description"
             placeholder="Description">

      <button>Add Expense</button>
    </form>

    <section id="dashboard"
             class="dashboard">
    </section>

    <div class="tools">

      <input id="search"
             placeholder="Search">

      <select id="filterCategory">
        <option value="">All Categories</option>
        <option>Academic</option>
        <option>Food</option>
        <option>Travel</option>
        <option>Shopping</option>
        <option>Bills</option>
        <option>Entertainment</option>
        <option>Other</option>
      </select>

            <div class="filter-group">
         <label for="filterDate">Filter by date</label>
         <input id="filterDate"
           type="date">
            </div>

            <div class="filter-group">
         <label for="filterDateFrom">From Date</label>
         <input id="filterDateFrom"
           type="date"
           aria-label="Filter expenses from date"
           title="Filter expenses from date">
            </div>

            <div class="filter-group">
         <label for="filterDateTo">To Date</label>
         <input id="filterDateTo"
           type="date"
           aria-label="Filter expenses to date"
           title="Filter expenses to date">
            </div>

    </div>

    <p id="error"></p>

    <section id="expenses"></section>

  </main>

  <script type="module"
          src="../js/main.js">
  </script>
</body>
</html>
